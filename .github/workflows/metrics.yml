name: Generate Profile Metrics

on:
  schedule:
    # Run automatically every 24 hours
    - cron: "0 0 * * *"
  
  # Allows manual triggers in GitHub Actions tab
  workflow_dispatch:

  # Run automatically on pushes to master
  push:
    branches:
      - master

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Compact Profile Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Plagiaryze2
          template: classic
          base: header, activity, community
          config_timezone: Asia/Karachi
          config_order: base.header, plugin_languages
          plugin_languages: yes
          plugin_languages_colors: github
          plugin_languages_limit: 6
          plugin_languages_details: percentage
