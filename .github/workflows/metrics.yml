name: Generate Profile Metrics & Analytics

on:
  schedule:
    # Run automatically every 24 hours
    - cron: "0 0 * * *"
  
  # Allows manual triggers in GitHub Actions tab
  workflow_dispatch:

  # Run automatically on pushes to master
  push:
    branches:
      - master

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      # 1. Streak Stats (Token-Authenticated)
      - name: Generate Streak Stats
        uses: DenverCoder1/github-readme-streak-stats@v1.4.0
        with:
          user: Plagiaryze2
          token: ${{ secrets.METRICS_TOKEN }}
          theme: tokyo-night
          hide_border: "true"
          output: "dist/streak.svg"

      # 2. Activity Graph (Token-Authenticated)
      - name: Generate Activity Graph
        uses: Ashutosh00710/github-readme-activity-graph@lts
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          target_user: Plagiaryze2
          theme: tokyo-night
          output: "dist/activity-graph.svg"

      # 3. Detailed Metrics & Top Languages (Token-Authenticated)
      - name: Generate Detailed Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Plagiaryze2
          template: classic
          base: header, activity, community, repositories
          config_timezone: Asia/Karachi
          plugin_languages: yes
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          filename: "dist/metrics.svg"

      # 4. Deploy all generated SVGs to output branch
      - name: Deploy Generated SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
